services:
  - type: web
    name: react-ecommerce
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm --prefix ecommerce-backend ci
    startCommand: npm --prefix ecommerce-backend start
    healthCheckPath: /api/products
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      # Set in the dashboard. The VITE_ ones are read by the build, so redeploy after changing them
      - key: PUBLIC_SITE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHAT_MODEL
        sync: false
      - key: CHAT_DAILY_LIMIT
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
