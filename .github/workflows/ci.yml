name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ecommerce-backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix ecommerce-backend ci

      - name: Lint
        run: npm run lint

      - name: Backend lint
        run: npm --prefix ecommerce-backend run lint

      - name: Backend typecheck
        run: npm --prefix ecommerce-backend run typecheck

      - name: Test
        run: npm test

      - name: Backend tests
        run: npm --prefix ecommerce-backend test

      - name: Build
        run: npm run build

  # The API tests again on Postgres, which production uses and which is stricter than SQLite
  backend-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ecommerce-backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix ecommerce-backend ci

      - name: Backend tests on Postgres
        run: npm --prefix ecommerce-backend test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ecommerce_test

  # A production build with the SQLite backend, driven in Chromium
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ecommerce-backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix ecommerce-backend ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
